# cargo-deny 0.20 config for rig-rs. Mirrors RUST-AGENT-GUIDE.md §2.5, plus explicit comments.
# Run: cargo deny check   (advisories, bans, licenses, sources)
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each entry: { id = "RUSTSEC-YYYY-NNNN", reason = "why + tracking issue" }
ignore = []

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0",
]
confidence-threshold = 0.9
# Allow-list is forward-looking; do not warn about licenses no dep uses yet.
unused-allowed-license = "allow"
# Workspace crates are publish = false; still check their declared license.
[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "use rustls" },
  { crate = "openssl-sys", reason = "use rustls" },
  { crate = "serde_yaml", reason = "archived upstream; use serde_yaml_ng (see RUST-AGENT-GUIDE)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
