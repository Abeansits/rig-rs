[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# Internal crates, plus external deps hoisted here when a slice needs them.
# Slice 1b: tokio (argv exec + tasks), tokio-util (cancellation + task tracking),
# async-trait (dyn Multiplexer), thiserror (MuxError), bytes (pane output),
# tracing (structured logs), ulid (unique paste buffer names), proptest (decoder).
[workspace.dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
proptest = "1.12.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
ulid = { version = "3.0.0", features = ["serde"] }
# `flock` for the daemon lock and the autostart lock (`fs` on crewmux-daemon
# and crewmux-cli) and `getuid` / `test_kill_process` (`process`).
# The mux crate uses `process` for the Linux SIGCHLD reap nudge.
# Provider tests use `process` to reap leftover tmux sockets.
# The stub agent uses `termios` so `C-u` reaches the process instead of the line discipline.
# `cargo add -p crewmux-daemon rustix --features fs,process`
# `cargo add -p crewmux-cli rustix --features fs`
# `cargo add -p crewmux-provider --dev rustix --features process`
rustix = "1.1.5"
crewmux-types = { path = "crates/crewmux-types" }
crewmux-spec = { path = "crates/crewmux-spec" }
crewmux-core = { path = "crates/crewmux-core" }
crewmux-store = { path = "crates/crewmux-store" }
crewmux-mux = { path = "crates/crewmux-mux" }
crewmux-adapters = { path = "crates/crewmux-adapters" }
crewmux-provider = { path = "crates/crewmux-provider" }
crewmux-messaging = { path = "crates/crewmux-messaging" }
crewmux-durability = { path = "crates/crewmux-durability" }
crewmux-transcript = { path = "crates/crewmux-transcript" }
crewmux-orchestration = { path = "crates/crewmux-orchestration" }
crewmux-health = { path = "crates/crewmux-health" }
crewmux-integrations = { path = "crates/crewmux-integrations" }
crewmux-api = { path = "crates/crewmux-api" }
crewmux-daemon = { path = "crates/crewmux-daemon" }
crewmux-mcp = { path = "crates/crewmux-mcp" }
crewmux-tui = { path = "crates/crewmux-tui" }
crewmux-cli = { path = "crates/crewmux-cli" }
# Slice 0b harness. Versions come from `cargo add` (crates.io, 2026-10-11), then hoisted.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
# Slice 1. Versions are whatever `cargo add` resolved (crates.io, 2026-10-11), then hoisted.
# serde-saphyr: RigSpec YAML (ADR-0007). rusqlite + rusqlite_migration: schema v1 (ADR-0003).
# axum: HTTP/1.1 over the Unix socket (ADR-0006). clap: the `rig` verb tree.
# anyhow: binaries only (`rig`, and the CLI crate which is the binary's command layer).
anyhow = "1.0.104"
assert_cmd = "2.2.2"
axum = { version = "0.8.9", features = ["json"] }
# Slice 4. `cargo add -p crewmux-daemon futures-core` (crates.io, 2026-10-11).
# The SSE body is a hand-written Stream; the daemon crate enables axum's `ws` feature.
futures-core = "0.3.34"
futures-util = "0.3.34"
nix = { version = "0.31.3", features = ["term", "signal", "poll"] }
parking_lot = "0.12.5"
ratatui = { version = "0.30.2", features = ["crossterm"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde-saphyr = "1.3.0"
tempfile = "3.27.0"
insta = "1.49.0"
# Slice 7. Versions come from `cargo add` (crates.io, 2026-10-11), then hoisted.
toml_edit = "0.25.17"
predicates = "3.1.4"
# Slice 5. Versions come from `cargo add` (crates.io, 2026-10-11), then hoisted.
# tokio-stream turns the watch task's mpsc into the SSE `Stream`.
# signal-hook lets `rig chatroom watch` exit 0 on SIGINT without an unsafe handler.
tokio-stream = { version = "0.1.19", features = ["sync"] }
signal-hook = "0.4.5"
# Slice 2. Versions come from `cargo add` (crates.io, 2026-10-12), then hoisted.
# uuid: Claude `--session-id` values are UUID v4.
# sha2: ADR-0009 delivery fingerprints.
# unicode-normalization: ADR-0009 common NFC step.
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"                 # escalate to deny for pub API of lib crates once stable
unused_must_use = "deny"
unreachable_pub = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
let_underscore_drop = "warn"

[workspace.lints.clippy]
# groups
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic noise we accept
module_name_repetitions = "allow"
missing_errors_doc = "allow"          # re-enable for public lib APIs later
must_use_candidate = "allow"
# restriction picks (agent guardrails)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "warn"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "deny"                  # allow in the CLI output module via #[allow] with reason
print_stderr = "deny"
exit = "deny"                          # only main may exit
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "warn"              # prefer #[expect(..., reason = "...")]
string_slice = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
rc_buffer = "warn"
wildcard_enum_match_arm = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
float_cmp = "warn"
too_many_lines = "warn"                # threshold in clippy.toml
cognitive_complexity = "warn"
# tests: allowed via clippy.toml allow-*-in-tests
