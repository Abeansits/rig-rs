# cargo-nextest config. Profiles: default (local), ci (CI gate), coverage (llvm-cov), slow (opt-in heavy suites).
[store]
dir = "target/nextest"

[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = true
# Real-tmux / differential tests are behind per-crate cargo features (tmux-it, differential)
# and are also filtered out here so a stray `--all-features` locally doesn't spawn tmux by surprise.
default-filter = "not (test(/tmux_it::/) | test(/differential::/))"

[profile.ci]
retries = 0                      # flakes must be fixed, not retried; see TEST-LAYOUT.md
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 3 }
default-filter = "not test(/differential::/)"

[profile.ci.junit]
path = "junit.xml"

# Coverage under llvm-cov: skip real-tmux (latency budget fails under instrumentation;
# tmux-matrix covers those tests) and differential (needs TS OpenRig).
[profile.coverage]
retries = 0
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 3 }
default-filter = "not (test(/tmux_it::/) | test(/differential::/))"

[profile.slow]
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 5 }
default-filter = "all()"

# Anything touching a real tmux server runs serially (private -L sockets, but CPU/pty bound)
# and takes every test thread. A 500ms death budget and a 64 KiB paste both miss when
# other tests keep the machine busy. Paste and fidelity stay in their own group.
[test-groups]
tmux = { max-threads = 1 }
tmux-heavy = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(/::tmux_it::paste_/) | test(/::tmux_it::control_fidelity_/)"
test-group = "tmux-heavy"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = "test(/::tmux_it::/) | test(/^tmux_it::/)"
test-group = "tmux"
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = "test(/::tmux_it::paste_/) | test(/::tmux_it::control_fidelity_/)"
test-group = "tmux-heavy"
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = "test(/::tmux_it::/) | test(/^tmux_it::/)"
test-group = "tmux"
threads-required = "num-test-threads"

# paste_reliability pastes a 64 KiB payload 200 times. On macOS CI
# (run 38195117384, head 1c241fb) nextest killed it at 180s while it was
# still running: SLOW at 60s and 120s, TERMINATING at 180s. That was not a
# hung read (the per-paste pull is 5s). tmux 3.8 on Ubuntu passed the same
# commit, and the macOS long-paste checks passed. 120s * 3 covers a runner
# about three times slower than the 107s local measurement.
[[profile.ci.overrides]]
filter = "test(/::tmux_it::paste_reliability/)"
test-group = "tmux-heavy"
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 3 }

[[profile.slow.overrides]]
filter = "test(/::tmux_it::paste_/) | test(/::tmux_it::control_fidelity_/)"
test-group = "tmux-heavy"
threads-required = "num-test-threads"

[[profile.slow.overrides]]
filter = "test(/::tmux_it::/) | test(/^tmux_it::/)"
test-group = "tmux"
threads-required = "num-test-threads"
