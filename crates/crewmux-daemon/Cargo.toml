[package]
name = "crewmux-daemon"
version = "0.0.0"
description = "The daemon: HTTP server, event streams, composition root and supervisors."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crewmux-api.workspace = true
crewmux-store.workspace = true
crewmux-core.workspace = true
crewmux-spec.workspace = true
crewmux-types.workspace = true
crewmux-adapters.workspace = true
crewmux-messaging.workspace = true
crewmux-durability.workspace = true
crewmux-transcript.workspace = true
crewmux-orchestration.workspace = true
crewmux-health.workspace = true
crewmux-integrations.workspace = true
crewmux-mux.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
futures-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
tokio-stream.workspace = true

[dev-dependencies]
crewmux-transcript.workspace = true
rusqlite.workspace = true

[features]
# In-memory multiplexer for debug test builds. Release binaries leave this off
# together with `debug_assertions`, so `RIG_FAKE_MUX` is not a production switch.
fake-mux = []

[lints]
workspace = true
