[package]
name = "crewmux-mux"
version = "0.0.0"
description = "Terminal multiplexer abstraction (the Multiplexer trait) and its tmux implementation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Real tmux integration tests. Off by default so `cargo test` uses FakeMux only.
tmux-it = []

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
crewmux-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
proptest = { workspace = true }
rustix = { workspace = true, features = ["process"] }
tokio = { workspace = true }

[[bin]]
name = "rig-fake-composer"
path = "src/bin/rig-fake-composer.rs"
required-features = ["tmux-it"]

[lints]
workspace = true
