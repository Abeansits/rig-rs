[package]
name = "crewmux-tui"
version = "0.0.0"
description = "Terminal UI backed by the daemon API client."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Real-tmux attach round trip. Off unless the caller passes `--features tmux-it`.
tmux-it = []

[[bin]]
name = "tui-pty-child"
path = "src/bin/pty_child.rs"
required-features = ["tmux-it"]

[dependencies]
crewmux-api.workspace = true
crossterm.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
