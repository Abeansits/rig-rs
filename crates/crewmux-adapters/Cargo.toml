[package]
name = "crewmux-adapters"
version = "0.0.0"
description = "Agent runtime adapters (the AgentAdapter trait) for Claude Code, Codex, OpenCode and a stub."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Real tmux integration tests. Off by default so `cargo test` uses FakeMux only.
tmux-it = []

[dependencies]
crewmux-mux.workspace = true
crewmux-provider.workspace = true
crewmux-core.workspace = true
crewmux-types.workspace = true
crewmux-transcript.workspace = true
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
rustix = { workspace = true, features = ["termios"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
