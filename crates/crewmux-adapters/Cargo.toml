[package]
name = "crewmux-adapters"
version = "0.0.0"
description = "Agent runtime adapters (the AgentAdapter trait) for Claude Code, Codex, OpenCode and a stub."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Real tmux coverage for the Codex launch path. Off by default so `cargo test`
# stays on FakeMux. CI's nextest job passes `--all-features`.
tmux-it = []

[dependencies]
crewmux-mux.workspace = true
crewmux-provider.workspace = true
crewmux-core.workspace = true
crewmux-types.workspace = true
async-trait.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
