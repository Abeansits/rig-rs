name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- Dev Bot's job (logic from main; actions pinned to commit SHAs) ----
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: Release 20-seat render budget
        run: cargo test -p crewmux-tui --release --locked --lib render_tests::twenty_seat_frame_is_under_five_milliseconds_in_release -- --exact

  # ---- QA Bot additions (new jobs only) ----
  nextest:
    name: nextest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Install tmux
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq tmux; else brew install tmux; fi
          tmux -V
      - name: nextest (ci profile; per-crate features; differential filtered out)
        env:
          INSTA_UPDATE: "no"
          RIG_HOME: ${{ runner.temp }}/rig-home
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export RIG_REQUIRE_TMUX=1
          fi
          cargo nextest run --workspace --all-targets --all-features --profile ci --no-tests=warn --locked
      - name: doctests (nextest does not run them)
        run: cargo test --workspace --doc --all-features --locked

  deny:
    name: cargo-deny (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [advisories, bans licenses sources]
    # New advisories shouldn't block unrelated PRs: advisories is required on main pushes
    # but tolerated on PRs (the scheduled/main run will go red and get triaged).
    continue-on-error: ${{ matrix.check == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
      # deny.toml ships with slice 0 (main).
      - name: cargo deny
        run: cargo deny --all-features check ${{ matrix.check }}

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version
        id: msrv
        shell: bash
        run: |
          v=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$v" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::workspace.package.rust-version not set; skipping MSRV until slice 0 sets it"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: steps.msrv.outputs.present == 'true'
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.msrv.outputs.present == 'true'
      - name: cargo check at MSRV
        if: steps.msrv.outputs.present == 'true'
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --all-features --locked

  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Source-only OpenRig pin for ledger case-name verification (no npm/build; <1 min).
      # Same pin, action SHA, and persist-credentials as .github/workflows/diff-ts.yml.
      # Checked out under the workspace (actions/checkout requires that), then moved
      # to runner.temp so lint-mux's workspace walk does not scan TS fixtures.
      - name: Checkout OpenRig v0.6.9
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mvschwarz/openrig
          ref: 4b48ca21a9bd072aa05a08b3da6d9c0708e093c5
          path: openrig
          persist-credentials: false
      - name: Move OpenRig out of the workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ runner.temp }}/openrig"
          mv openrig "${{ runner.temp }}/openrig"
      - name: File size limit (800 lines, non-test .rs)
        shell: bash
        run: |
          bad=$(find crates xtask -name '*.rs' -not -path '*/tests/*' 2>/dev/null | xargs -r awk 'FNR==1&&NR>1{if(n>800)print f": "n} {f=FILENAME;n=FNR} END{if(n>800)print f": "n}')
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - name: No bare #[ignore] (must carry a reason)
        shell: bash
        run: |
          if grep -rnE '#\[ignore\]' crates tests 2>/dev/null; then echo "use #[ignore = \"reason + issue\"]"; exit 1; fi
      - name: No pending insta snapshots committed
        shell: bash
        run: |
          if find . -name '*.snap.new' -o -name '*.pending-snap' | grep -q .; then echo "pending snapshots committed"; exit 1; fi
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Parity ledger check (parity/ledger.csv)
        env:
          OPENRIG_DIR: ${{ runner.temp }}/openrig
        run: cargo run -p xtask --locked -- ledger check
      - name: lint-mux (crewmux-mux human-client / shell ban)
        run: cargo run -p xtask --locked -- lint-mux

  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - name: llvm-tools for the pinned toolchain
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: llvm-cov (nextest, coverage profile)
        env:
          INSTA_UPDATE: "no"
        run: |
          # coverage profile excludes ::tmux_it:: (latency budget fails under
          # instrumentation; tmux-matrix covers them) and ::differential::.
          cargo llvm-cov nextest --workspace --all-features --profile coverage --no-tests=warn --locked --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore

  tmux-matrix:
    name: real tmux ${{ matrix.tmux }} (from source, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.3a = oldest supported, 3.5a = ADR 0005 reference, 3.8 = latest tmux/tmux release.
        # macOS keeps brew tmux in the nextest job (from-source on macOS is slow/fragile).
        # sha256 pins the GitHub release tarball; verified with sha256sum -c before extract.
        # Cross-checked: FreeBSD ports + Debian/PureOS (3.3a/3.5a), Homebrew + FreeBSD (3.8).
        include:
          - tmux: "3.3a"
            sha256: "e4fd347843bd0772c4f48d6dde625b0b109b7a380ff15db21e97c11a4dcdf93f"
          - tmux: "3.5a"
            sha256: "16216bd0877170dfcc64157085ba9013610b12b082548c7c9542cc0103198951"
          - tmux: "3.8"
            sha256: "e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache tmux build
        id: tmux-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/tmux-${{ matrix.tmux }}
          key: tmux-${{ matrix.tmux }}-${{ runner.os }}-${{ runner.arch }}-v2
      - name: Build tmux ${{ matrix.tmux }} from source
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          V: ${{ matrix.tmux }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libevent-dev libncurses-dev bison pkg-config
          # Build outside the checkout. A tree named tmux-* at the repo root is
          # picked up by xtask lint-mux (tmux.1.mdoc mentions a banned format).
          work="${RUNNER_TEMP}/tmux-src-${V}"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          curl -fsSL -o tmux.tgz "https://github.com/tmux/tmux/releases/download/${V}/tmux-${V}.tar.gz"
          echo "${EXPECTED_SHA256}  tmux.tgz" | sha256sum -c -
          tar xzf tmux.tgz
          cd "tmux-${V}"
          ./configure --prefix="$HOME/.local/tmux-${V}" >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null
      - name: Runtime libs (cache hit path)
        if: steps.tmux-cache.outputs.cache-hit == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libevent-dev libncurses-dev
      - name: Put tmux first on PATH and assert version
        shell: bash
        env:
          V: ${{ matrix.tmux }}
        run: |
          set -euo pipefail
          echo "$HOME/.local/tmux-${V}/bin" >> "$GITHUB_PATH"
          got=$("$HOME/.local/tmux-${V}/bin/tmux" -V)
          echo "tmux -V: $got"
          [ "$got" = "tmux ${V}" ] || { echo "::error::expected tmux ${V}, got '$got'"; exit 1; }
      - name: Verify PATH resolution
        run: command -v tmux && tmux -V
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Real-tmux tests (workspace, all-features, ci profile)
        shell: bash
        env:
          INSTA_UPDATE: "no"
          RIG_HOME: ${{ runner.temp }}/rig-home
          RIG_REQUIRE_TMUX: "1"
        run: |
          set -euo pipefail
          # Workspace-wide so slice-1 (and later) crates/*/tests real-tmux cases
          # run on each pinned tmux, not only crewmux-mux. ci profile includes
          # ::tmux_it:: and excludes ::differential::. Stays green when no
          # crate has declared tmux-it yet (those modules simply are not built).
          cargo nextest run --workspace --all-features --profile ci --locked --no-tests=warn

  # Single required check for branch protection: add only "ci-pass" as required.
  ci-pass:
    name: ci-pass
    if: always()
    needs: [check, nextest, deny, msrv, guards, tmux-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "a required job did not succeed"; exit 1; }; done
