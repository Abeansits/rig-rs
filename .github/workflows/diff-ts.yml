name: diff-ts

# Nightly, and on PRs labeled diff-ts. ci.yml is unchanged; this file is the TS gate.
on:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: "no"

concurrency:
  group: diff-ts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diff-ts:
    name: xtask diff against OpenRig v0.6.9
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'diff-ts')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rig-rs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout OpenRig v0.6.9
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mvschwarz/openrig
          ref: 4b48ca21a9bd072aa05a08b3da6d9c0708e093c5
          path: openrig
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openrig/package-lock.json

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux && tmux -V

      - name: Install and build OpenRig v0.6.9
        working-directory: openrig
        run: npm ci && npm run build -w @openrig/daemon && npm run build -w @openrig/cli

      - name: Build rig
        run: cargo build -p rig

      - name: Ledger check
        run: cargo xtask ledger check

      - name: Diff against OpenRig v0.6.9
        env:
          OPENRIG_DIR: ${{ github.workspace }}/openrig
        run: cargo xtask diff
